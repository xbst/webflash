# The parity matrix: one row per MCU family and flashing path (WebFlash SPEC
# Appendix B). Every row is a minimal configuration, exactly what
# `make savedefconfig` writes for it, per project the row applies to.
#
# `webflash make-check` compares the make interpreter with GNU make on each
# row; `webflash parity` builds each row with GCC and clang and compares the
# results; `.github/workflows/ci.yml` runs both. See README.md beside this file.
#
# A row's keys: `name`, `projects`, `why`, `defconfig`, and optionally
# `unless`, a list of Kconfig symbols (without CONFIG_): the row does not
# apply to a tree whose Kconfig defines any of them, so a row for an older
# layout is skipped on the trees that have the newer one.

[[row]]
name = "stm32g0b1-usb"
projects = ["klipper", "kalico"]
why = "the Isik's Tech boards; Katapult + DFU"
defconfig = """
CONFIG_MACH_STM32=y
CONFIG_MACH_STM32G0B1=y
"""

[[row]]
name = "stm32g0b1-can"
projects = ["klipper", "kalico"]
why = "CAN toolheads"
defconfig = """
CONFIG_MACH_STM32=y
CONFIG_MACH_STM32G0B1=y
CONFIG_STM32_MMENU_CANBUS_PB0_PB1=y
"""

[[row]]
name = "stm32f072-usbcan"
projects = ["klipper"]
why = "ToqueCAN-style bridges; F0 has HAVE_LIMITED_CODE_SIZE"
defconfig = """
CONFIG_MACH_STM32=y
CONFIG_MACH_STM32F072=y
CONFIG_STM32_FLASH_START_0000=y
CONFIG_STM32_USBCANBUS_PA11_PA12=y
"""

[[row]]
name = "stm32f103-usb"
